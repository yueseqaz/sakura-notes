name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift test

  release-build:
    name: Release .app artifact
    runs-on: macos-15
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app bundle
        run: bash scripts/build_app.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraNotes-${{ github.ref_name }}
          path: dist/SakuraNotes.app
